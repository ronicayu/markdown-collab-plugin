name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package only, skip marketplace publish'
        type: boolean
        default: false

permissions:
  contents: write

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in now so the
# checkout/setup-node/upload-artifact steps run on the supported runtime and
# stop emitting the Node 20 deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # A tag is the moment to be sure. CI runs these on every push; running
      # them here too means a tag can never ship a build that only the fast
      # suite has seen.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Install Chromium for the webview suite
        run: npx playwright install --with-deps chromium

      - name: Webview e2e tests
        run: npm run test:webview

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG.md has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing — every release must document its changes."
            exit 1
          fi
          if ! grep -qE "^## ${VERSION}( |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section. Add a short description of what's in this release before tagging."
            echo "::error::Expected a heading like:  ## ${VERSION} — $(date -u +%Y-%m-%d)"
            exit 1
          fi
          echo "CHANGELOG entry for ${VERSION} found."

      - name: Package
        run: npx --yes @vscode/vsce package --out markdown-collab-plugin.vsix

      # The same assertion CI makes on every push: every asset the extension
      # loads by URI is in the vsix, and the host bundle requires nothing that
      # wasn't bundled.
      - name: Verify packaged assets and bundled requires
        run: node scripts/verify-package.mjs markdown-collab-plugin.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: markdown-collab-plugin.vsix

      # Three destinations, chosen by markers in the release commit message:
      #
      #   [skip-publish]  GitHub Release only. Nothing goes public.
      #   [pre-release]   PUBLIC, on the marketplaces' pre-release channel —
      #                   users who opted in get it as an auto-update, everyone
      #                   else stays on stable. This is how a dogfood build
      #                   reaches a real install without a manual .vsix.
      #   (neither)       PUBLIC stable release.
      #
      # A marketplace version must be plain x.y.z, so the channel can't live in
      # the tag name; it lives in the commit message, like [skip-publish] does.
      - name: Gate marketplace publish
        id: gate
        run: |
          # Subject line only: a release commit's body routinely describes these
          # markers, and matching there would let a changelog sentence choose
          # the publish channel.
          MSG="$(git log -1 --pretty=%s)"
          if printf '%s' "$MSG" | grep -q '\[skip-publish\]'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "channel=none" >> "$GITHUB_OUTPUT"
            echo "Release commit requests [skip-publish] — skipping marketplace publish."
          elif printf '%s' "$MSG" | grep -q '\[pre-release\]'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "channel=pre-release" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing to the PRE-RELEASE channel on both marketplaces."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing a STABLE release to both marketplaces."
          fi

      # Prints what this tag will do and fails on anything a script can decide
      # (missing or empty CHANGELOG section, version mismatch, contradictory
      # markers). The rest of the list is printed for the human running it.
      - name: Release checklist
        run: node scripts/release-checklist.mjs

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && env.VSCE_PAT != '' && steps.gate.outputs.publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRE: ${{ steps.gate.outputs.channel == 'pre-release' && '--pre-release' || '' }}
        run: npx --yes @vscode/vsce publish --packagePath markdown-collab-plugin.vsix --pat "$VSCE_PAT" $PRE

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && env.OVSX_PAT != '' && steps.gate.outputs.publish == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PRE: ${{ steps.gate.outputs.channel == 'pre-release' && '--pre-release' || '' }}
        run: npx --yes ovsx publish markdown-collab-plugin.vsix --pat "$OVSX_PAT" $PRE

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section starting with "## $VERSION " (followed by space or end-of-line)
          # up to (but not including) the next "## " heading. Empty if no match —
          # the next step then falls back to --generate-notes.
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## / {
              if (capture) exit
              if ($2 == ver) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Trim trailing blank lines.
          sed -e :a -e '/^$/N;/\n$/ba' -i.bak release-notes.md && rm -f release-notes.md.bak
          if [ -s release-notes.md ]; then
            echo "Release notes for $VERSION:"
            cat release-notes.md
          else
            echo "No CHANGELOG entry for $VERSION; will fall back to auto-generated notes."
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag makes a GitHub pre-release too, so the two
          # channels agree about what "latest" means.
          PRERELEASE=""
          if [ "${{ steps.gate.outputs.channel }}" != "stable" ]; then
            PRERELEASE="--prerelease"
          fi
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              markdown-collab-plugin.vsix \
              --title "$GITHUB_REF_NAME" \
              $PRERELEASE \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              markdown-collab-plugin.vsix \
              --title "$GITHUB_REF_NAME" \
              $PRERELEASE \
              --generate-notes
          fi
