name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # Real package, NOT `--no-dependencies`. The release pipeline ships
      # the same artifact; CI must catch a broken package before a tag goes
      # out, not after.
      - name: Package (full)
        run: npx --yes @vscode/vsce package --out markdown-collab-plugin.vsix

      # Asserts every asset the extension loads by URI is inside the vsix, and
      # that the host bundle requires nothing that wasn't bundled. Replaces a
      # check that listed yjs / y-protocols / ws — dependencies deleted in
      # v0.34.44–0.34.46, which left CI red for reasons no one was reading.
      - name: Verify packaged assets and bundled requires
        run: node scripts/verify-package.mjs markdown-collab-plugin.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: markdown-collab-plugin.vsix
          if-no-files-found: error

  # The Extension Host suite: the only tests that exercise real TextDocuments,
  # WorkspaceEdits, and files changing on disk under an open editor — the layer
  # the anchoring and live-editor regressions actually lived in.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VS Code needs a display even for the headless suites; the display-bound
      # tests skip themselves, the rest run.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

  # The click layer: the shipped webview bundles driven by a real pointer in
  # real Chromium, asserting the exact message each control posts to the host.
  # These are the flows that used to be signed off by a manual dev-host pass
  # before every release (accept/reject, Send, suggest toggle, live-editor
  # accept + composer) — the reason a batch of versions could sit unreleased.
  webview-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Chromium only: the webviews run in VS Code's Electron (Chromium), so
      # Firefox/WebKit would be testing engines the product never sees.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Webview e2e tests
        run: npm run test:webview

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webview-e2e-report
          path: playwright-report/
          retention-days: 7
